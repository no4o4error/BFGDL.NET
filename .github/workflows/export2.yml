name: Build BFGDL for Windows 8.1
on: workflow_dispatch

jobs:
  build-win8:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Force Clean Target Frameworks and Fix Compatibility
        shell: powershell
        run: |
          Get-ChildItem -Filter *.csproj -Recurse | ForEach-Object {
              $content = Get-Content $_.FullName
              $content = $content -replace '<TargetFramework>.*?</TargetFramework>', '<TargetFramework>net10.0</TargetFramework>'
              if ($content -notmatch '<InvariantGlobalization>') {
                  $content = $content -replace '</PropertyGroup>', "  <InvariantGlobalization>true</InvariantGlobalization>`n  </PropertyGroup>"
              }
              Set-Content $_.FullName -Value $content
          }

      - name: Publish Main CLI Project Directly
        shell: powershell
        run: |
          $projectFile = Get-ChildItem -Filter *.csproj -Recurse | Where-Object { $_.FullName -notmatch "Core" -and $_.FullName -notmatch "GUI" } | Select-Object -First 1 -ExpandProperty FullName
          dotnet publish $projectFile -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=false -o ./build

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bfgdl-windows-8.1
          path: ./build/
